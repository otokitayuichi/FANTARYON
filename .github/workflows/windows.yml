# FANTARYON Windows版（exe）自動ビルド
# 仕様：
#  - mainへのpush（public/・src-tauri/ などの変更時）または手動実行で、public/ をTauriでWindowsアプリ化してexeを作る
#  - ゲーム本体はexeに埋め込む（インストール不要・展開処理なし・1ファイル）。表示はWindows標準のWebView2を使う
#  - 起動時はウィンドウ（1280×720）。F11 / Alt+Enter で全画面に切り替え、Alt+F4 で終了
#  - バージョンはリポジトリ直下 package.json の version を使う（tauri.conf.json から参照）
#  - GitHubの実行環境で一時的な通信エラーが起きるため、ビルドは失敗時に最大5回やり直す
#  - 完成したexeはReleases「windows-latest」に固定ファイル名 fantaryon.exe と、itch用zip fantaryon_windows.zip（中身 FANTARYON.exe）で公開する（毎回置き換え）
#  - Android版のReleases「android-latest」を「最新」に保つため、こちらは --latest=false で公開する
#  - コード署名はしない
name: Windows EXE

on:
  push:
    branches: [main]
    paths:
      - 'public/**'
      - 'src-tauri/**'
      - 'package.json'
      - '.github/workflows/windows.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: exeのビルド（通信失敗時は最大5回やり直す）
        shell: bash
        working-directory: src-tauri
        run: |
          for i in 1 2 3 4 5; do
            npx --yes @tauri-apps/cli@2 build --no-bundle && test -f target/release/fantaryon.exe && exit 0
            echo "ビルド失敗（${i}回目）。20秒後にやり直します"; sleep 20
          done
          exit 1

      - name: exeの名前をそろえ、itch用のzipも作る
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force out, out/zip | Out-Null
          Copy-Item src-tauri/target/release/fantaryon.exe out/fantaryon.exe
          Copy-Item src-tauri/target/release/fantaryon.exe out/zip/FANTARYON.exe
          Compress-Archive -Path out/zip/FANTARYON.exe -DestinationPath out/fantaryon_windows.zip -Force
          Get-ChildItem out

      - uses: actions/upload-artifact@v4
        with:
          name: fantaryon-exe
          path: |
            out/fantaryon.exe
            out/fantaryon_windows.zip

      - name: Releasesに公開（固定URL）
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete windows-latest --yes --cleanup-tag || true
          gh release create windows-latest out/fantaryon.exe out/fantaryon_windows.zip \
            --title "FANTARYON Windows（最新ビルド）" \
            --notes "mainブランチの最新版から自動ビルドしたWindows版です。インストール不要、ダブルクリックで起動（ウィンドウで起動。F11 / Alt+Enter で全画面に切り替え）。Windows 10/11 標準のWebView2で動作します。" \
            --latest=false
