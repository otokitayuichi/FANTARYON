<!DOCTYPE html>
<!--
================================================================
 仕様コメント
 タイトル  : FANTARYON（ファンタリオン）
 名称由来  : Fantasy × Beyond × Orion
 ゲーム制作: ottoky studio
 音楽      : Romeo Hijo（Delusion sound track 01）
 スタッフ  : 制作スタジオ ottoky studio／ゲーム制作 おとっきー／シナリオ おとっきー・Romeo Hijo／
             デザイン おとっきー／キャラクター Romeo Hijo／音楽 Romeo Hijo
 版        : 0.9.2（2026-11-23）オープニングを作り直し（警報をじわじわ、ドラグナー風のカットイン、3人並び）／Androidのバージョン番号を自動採番
             0.9.1（2026-11-23）画像・BGMを別ファイル化（iPhoneのSafari・Chromeで読み込みが途中で切れる問題への対策）／
             空母画像差し替え・甲板シーンの機体を拡大
             0.9（2026-11-23）OP再構成（月の来訪体→スクランブル→甲板→空母→大気圏外、ブースターなし）／
             2周目を別時空ANOTHERに変更・セリフ修正・突入ミニOP／ポーズに「タイトルへ戻る」
             0.8（2026-11-23）2周目は左右反転なし（自機は1周目と同じく左側）／OPを空母発進→大気圏外に変更／会話追加／正体はシステムログで示す演出に変更／
             真エンドの照準を自機カメラ視点で表現／2ND MISSION（2周目）／チュートリアル／サウンドトラック／
             ラスボスの溜め撃ちビーム／2面ボスの四角表示を修正
             0.7（2026-11-23）自機弾を敵弾と区別できる形・色に変更／コア突入を自由操縦・ボス本体への接触で判定／
             真エンディングはボムでコアを破壊して終了する流れに変更
             0.6 全3面＋通常/真エンディング＋スタッフロール／ライフ制／ステージセレクト（デバッグ）
 ----------------------------------------------------------------
 概要      : 横画面・横スクロールシューティング。
             ロゴ → オープニング → タイトル → ステージセレクト → 会話 → 1面 → ボス → 会話 → 2面 → ボス
             → 会話 → 3面 → ラスボス → コア突入 → エンディング（通常／真） → スタッフロール → 結果 → タイトル
 動作環境  : Webブラウザ（Cloudflare Workersで静的配信）。index.html＋assets/（画像png/jpg・BGM mp3）。
             画像は起動時に読み込み、BGMは使う直前にfetchしてデコードする（容量の大きい1ファイルはiOSで接続が切れるため）。
             Androidは開始時に全画面化＋横向き固定を試行。iPhoneは「ホーム画面に追加」を案内。
 画面      : 論理解像度 480×270（16:9）。背景層（画面解像度）＋スプライト層（480×270をぼかさず拡大）＋UI層。
             下端18ドットはHUD帯（残機・ライフ・ボム・スコア・機体形態・敵名）。
 オープニング : 約60秒。宇宙の字幕 → 月の裏から来訪体 → 来訪体が地球へ → 静かな司令室のレーダー → 少佐が気付く
                → 警報灯でじわじわ赤くなる（WARNINGは細い帯）→ SCRAMBLE＋少佐カットイン → 軍曹カットイン
                → コクピットのポップ（LOCK）→ 甲板のカタパルト発進 → 空母の船首から飛び立つ → 雲を抜けて大気圏外へ
                → 3人の並び → タイトル。ブースターは使わない。描画は960×540座標（0.5倍で論理解像度へ）。
 ステージ  : 1面 地球周回軌道（Spaceship -Lollipop-）／ボス 群体マザーベリー（魚）（First Approach）
             2面 月軌道（Spaceship -Hazelnut-）地形あり／ボス 境界体ボーダーシェル（貝）（Border Line）
             3面 外宇宙（Outer Zone）／ラスボス 中心核フェイタル（クラゲ）（Fatal Command）
             エンディング（Final Decision）、オープニング・タイトル（Ready）
 ラスボスの溜め撃ち : 中心核フェイタル（1・2周目共通）は約1.6秒の溜め（予告線と光の収束）のあと、
             口から画面左端まで極太ビームを約1.7秒照射する。2周目の鏡の自分も最終段階で使用する。
 弾の見分け : 自機弾＝黄緑の細長い光弾（白い芯＋尾）／レーザー＝金色の太い帯。敵弾＝丸い弾（1・2面ピンク、3面シアン）に黒縁。
 機体      : 1面＝LOLLIPOP形態（拡散ショット）、2面＝HAZELNUT形態（貫通レーザー＋オプション2基）、
             3面＝両形態をC キー／換装ボタンで切替可能。
 残機・ライフ : 残機3（開始時の自機を除くストック）。1機ごとにライフ2。被弾でライフ−1（短い無敵）、0で1機失う（残機−1、ライフ2で復活）。
             残機が尽きるとゲームオーバー。コンティニューは無制限（その場のチェックポイントから再開）。
 ラスボス撃破後（コア段階）: 弾が止まり、自由操縦。
             ・コンティニューあり：少佐の突入命令 → ボスに体当たり → 自爆演出（約3.6秒：操作不可、
               機体が赤く明滅 →「自爆シーケンス起動」→ 白い爆発が画面を覆う） → 通常エンディング
             ・コンティニューなし：突入命令の直後に少佐が中止を命じ、ボムでコアを破壊 → 真エンディング
               （この流れでは体当たりは無効。ボムが0の場合は1発補給する）
 真エンディング条件 : 一度もコンティニューせずにラスボスを倒すこと（被弾・ミスは条件に含まない）。
 タイトルメニュー : ゲームスタート（→ステージセレクト）／2ND MISSION（解放後のみ）／あそびかた／サウンドトラック
 ステージセレクト : デバッグ用として全ステージ・全ボス・両エンディングを選択可能（2ND MISSIONは表示しない）。
 チュートリアル : 初回のSTAGE 1開始時に自動で実施（移動→射撃→ボム→ライフ説明）。以後は「あそびかた」から。スキップ可。
 2ND MISSION（ANOTHER）: 真エンディング到達で解放（端末内に保存）。タイトルで「630」とキー入力しても解放できる（テスト用）。
             1周目で逃げ延びたマザーベリーを追い、月の裏の時空の裂け目から「別時空の宇宙」へ向かう。
             出撃前会話 → 別時空突入ミニOP（約24秒・無線つき・スキップ可）→ ANOTHER 1〜3。
             別時空は1周目で自機がコアに突入して消えた時間軸。画面の向きと操作は1周目と同じ（自機は左側）。曲と敵は1周目と同じ（色調のみ変化）。
             1面ボスは同じ個体のマザーベリー（生存個体）で、最初から傷が残っている。
             難しさは弾数増加（狙い弾に左右の弾を追加、全方位弾は1.5倍）、全面に天井・床の地形、破壊不能の障害物で上げる。
             ラスボス撃破後に「もう一人のLOLLIPOP」と戦い、後日談エンディング（2ND MISSION COMPLETE）へ。
 サウンドトラック : 全8曲を選んで再生・停止できる。
 保存      : 端末内（localStorage）に「チュートリアル済み」「2ND MISSION解放」「2ND MISSIONクリア」のみ保存。
 ポーズ    : Esc/P または右上のボタンで一時停止。「ゲームを再開」「タイトルへ戻る」を選べる。
 操作      : スマホ  左側＝アナログスティック、右側＝長押しでショット、BOMB／換装ボタン、右上＝一時停止
             キーボード 矢印/WASD＝移動、Shift＝低速、Z/Space/J＝ショット、X/K＝ボム、C＝換装（3面）、
                        Enter/Z＝決定・会話送り、S＝会話スキップ、Esc/P＝一時停止
             マウス  クリック長押し＝ショット
 音        : BGMはWeb Audio APIでループ再生。メモリ節約のため、使う直前に1曲ずつ展開し、使わない曲は解放する。
             効果音は合成（素材ファイルなし）。
================================================================
-->

<body>
<canvas id="c" tabindex="0" aria-label="ゲーム画面"></canvas>
<div id="safe"></div>
<script>
{
// ===== 素材 =====
const ASSET={logo:"assets/logo.jpg",pop:"assets/pop.png",maj:"assets/maj.png",sgt:"assets/sgt.png",space:"assets/space.jpg",space3:"assets/space3.jpg",earth:"assets/earthtex.jpg",moontex:"assets/moontex.jpg",moon:"assets/moon.png",ship_l:"assets/ship_l.png",ship_h:"assets/ship_h.png",ship_shadow:"assets/ship_shadow.png",orb:"assets/orb.png",boss1:"assets/boss1.png",boss2:"assets/boss2.png",boss3:"assets/boss3.png",boss1_m:"assets/boss1_m.png",boss2_m:"assets/boss2_m.png",boss3_m:"assets/boss3_m.png",boss2_closed:"assets/boss2_closed.png",boss2_m_closed:"assets/boss2_m_closed.png",boss4:"assets/boss4.png",carrier2:"assets/carrier2.png",deck2:"assets/deck2.jpg",e_jelly:"assets/e_jelly.png",e_jelly_2:"assets/e_jelly_2.png",e_jelly_3:"assets/e_jelly_3.png",e_jelly_m:"assets/e_jelly_m.png",e_chick:"assets/e_chick.png",e_chick_2:"assets/e_chick_2.png",e_chick_3:"assets/e_chick_3.png",e_chick_m:"assets/e_chick_m.png",e_jellyfish:"assets/e_jellyfish.png",e_jellyfish_2:"assets/e_jellyfish_2.png",e_jellyfish_3:"assets/e_jellyfish_3.png",e_jellyfish_m:"assets/e_jellyfish_m.png",e_puffer:"assets/e_puffer.png",e_puffer_2:"assets/e_puffer_2.png",e_puffer_3:"assets/e_puffer_3.png",e_puffer_m:"assets/e_puffer_m.png",e_mini:"assets/e_mini.png",e_mini_2:"assets/e_mini_2.png",e_mini_3:"assets/e_mini_3.png",e_mini_m:"assets/e_mini_m.png",e_slug:"assets/e_slug.png",e_slug_2:"assets/e_slug_2.png",e_slug_3:"assets/e_slug_3.png",e_slug_m:"assets/e_slug_m.png",e_flower:"assets/e_flower.png",e_flower_2:"assets/e_flower_2.png",e_flower_3:"assets/e_flower_3.png",e_flower_m:"assets/e_flower_m.png"};
const MUSIC={ready:"assets/m_ready.mp3",lollipop:"assets/m_lollipop.mp3",first:"assets/m_first.mp3",hazelnut:"assets/m_hazelnut.mp3",border:"assets/m_border.mp3",outer:"assets/m_outer.mp3",fatal:"assets/m_fatal.mp3",final:"assets/m_final.mp3"};
const FONT="'DotGothic16','Hiragino Kaku Gothic ProN','Noto Sans JP',sans-serif";
const VERSION='0.9.2';

// ===== 画面 =====
const W=480,H=270,HUD=18,PH=H-HUD;
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
const buf=document.createElement('canvas');buf.width=W;buf.height=H;
const b=buf.getContext('2d');b.imageSmoothingEnabled=false;
let dpr=1,cw=0,ch=0,sc=1,ox=0,oy=0,safe={t:0,r:0,b:0,l:0};
const isTouchDev=(('ontouchstart' in window)||navigator.maxTouchPoints>0)&&!matchMedia('(pointer:fine)').matches;
let isTouch=isTouchDev;
const isIOS=/iP(hone|ad|od)/.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const standalone=window.navigator.standalone===true||matchMedia('(display-mode: standalone)').matches||matchMedia('(display-mode: fullscreen)').matches;
function resize(){
  dpr=Math.min(window.devicePixelRatio||1,3);cw=innerWidth;ch=innerHeight;
  cv.width=Math.round(cw*dpr);cv.height=Math.round(ch*dpr);
  const st=getComputedStyle(document.getElementById('safe'));
  safe={t:parseFloat(st.paddingTop)||0,r:parseFloat(st.paddingRight)||0,b:parseFloat(st.paddingBottom)||0,l:parseFloat(st.paddingLeft)||0};
  sc=Math.min((cw-safe.l-safe.r)/W,(ch-safe.t-safe.b)/H);
  ox=safe.l+((cw-safe.l-safe.r)-W*sc)/2;oy=safe.t+((ch-safe.t-safe.b)-H*sc)/2;
}
addEventListener('resize',resize);resize();

// ===== 画像 =====
const IMG={};for(const k in ASSET){const i=new Image();i.src=ASSET[k];IMG[k]=i;}
function circ(g,x,y,r,col){g.fillStyle=col;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
const ENEMY_DEF={
  jelly:{name:'ジェリム',img:'e_jelly',r:11,hp:2,score:100},
  chick:{name:'ピヨル',img:'e_chick',r:10,hp:1,score:80},
  jellyfish:{name:'ミラクラ',img:'e_jellyfish',r:11,hp:3,score:250},
  puffer:{name:'プクル',img:'e_puffer',r:12,hp:4,score:200},
  mini:{name:'プクル（分裂体）',img:'e_mini',r:7,hp:1,score:50},
  slug:{name:'ナメリン',img:'e_slug',r:12,hp:5,score:300},
  flower:{name:'ハナクチ',img:'e_flower',r:11,hp:2,score:150},
  shadow:{name:'カゲ（自機の影）',img:'ship_shadow',r:10,hp:14,score:800},
  rock:{name:'鏡の破片（破壊不能）',img:null,r:12,hp:1,score:0},
  target:{name:'訓練用ターゲット',img:'e_jelly',r:11,hp:1,score:0},
};
function spr(w,h,fn){const c=document.createElement('canvas');c.width=w;c.height=h;fn(c.getContext('2d'));return c;}
const SP_ITEM_P=spr(14,14,g=>{circ(g,7,7,7,'#1a1420');circ(g,7,7,6,'#ff5a3c');g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('P',7,7.5);});
const SP_ITEM_B=spr(14,14,g=>{circ(g,7,7,7,'#1a1420');circ(g,7,7,6,'#3c7cff');g.fillStyle='#fff';g.font='bold 9px sans-serif';g.textAlign='center';g.textBaseline='middle';g.fillText('B',7,7.5);});

// ===== 音（BGMは使う直前に展開） =====
let AC=null,master=null,musicGain=null,sfxGain=null,echoIn=null,curSrc=null,curName=null;const BUF={},DECODING={};
function b64buf(s){const bin=atob(s),u=new Uint8Array(bin.length);for(let i=0;i<bin.length;i++)u[i]=bin.charCodeAt(i);return u.buffer;}
function initAudio(){
  if(AC){if(AC.state==='suspended'&&!paused)AC.resume();return;}
  try{AC=new (window.AudioContext||window.webkitAudioContext)();}catch(e){return;}
  master=AC.createGain();master.gain.value=0.9;master.connect(AC.destination);
  musicGain=AC.createGain();musicGain.gain.value=0.7;musicGain.connect(master);
  sfxGain=AC.createGain();sfxGain.gain.value=0.35;sfxGain.connect(master);
  echoIn=AC.createGain();echoIn.gain.value=0.5;const dl=AC.createDelay(1.0);dl.delayTime.value=0.22;const fb=AC.createGain();fb.gain.value=0.42;const lp=AC.createBiquadFilter();lp.type='lowpass';lp.frequency.value=2200;
  echoIn.connect(dl);dl.connect(lp);lp.connect(fb);fb.connect(dl);lp.connect(sfxGain);
  const o=AC.createOscillator(),g=AC.createGain();g.gain.value=0;o.connect(g);g.connect(master);o.start();o.stop(AC.currentTime+0.05);
  if(curName)loadMusic(curName,()=>startSrc(curName));
}
let keepMusic=[];
function loadMusic(k,cb){
  if(!AC||!MUSIC[k])return;if(BUF[k]){cb&&cb();return;}
  if(DECODING[k]){if(cb)DECODING[k].push(cb);return;}DECODING[k]=cb?[cb]:[];
  fetch(MUSIC[k]).then(r=>{if(!r.ok)throw 0;return r.arrayBuffer();}).then(ab=>AC.decodeAudioData(ab,d=>{BUF[k]=d;const cbs=DECODING[k];delete DECODING[k];evict();cbs.forEach(f=>f());},()=>{delete DECODING[k];})).catch(()=>{delete DECODING[k];});
}
function evict(){for(const k in BUF){if(k!==curName&&!keepMusic.includes(k))delete BUF[k];}}
function preloadMusic(k){if(!keepMusic.includes(k))keepMusic=[k];loadMusic(k);}
function startSrc(k){if(curName!==k||curSrc||!BUF[k])return;const s=AC.createBufferSource();s.buffer=BUF[k];s.loop=true;s.connect(musicGain);s.start();curSrc=s;}
function playMusic(k){if(curName===k)return;stopMusic();curName=k;if(AC){musicGain.gain.cancelScheduledValues(AC.currentTime);musicGain.gain.setValueAtTime(0.7,AC.currentTime);}keepMusic=keepMusic.filter(x=>x!==k);loadMusic(k,()=>startSrc(k));evict();}
function stopMusic(){if(curSrc){try{curSrc.stop();}catch(e){}curSrc=null;}curName=null;}
function fadeMusic(t){if(!AC||!curSrc)return;const n=AC.currentTime;musicGain.gain.cancelScheduledValues(n);musicGain.gain.setValueAtTime(musicGain.gain.value,n);musicGain.gain.linearRampToValueAtTime(0.0001,n+t);const s=curSrc;setTimeout(()=>{if(curSrc===s){stopMusic();musicGain.gain.setValueAtTime(0.7,AC.currentTime);}},t*1000+50);}
function duck(t){if(!AC)return;const n=AC.currentTime;musicGain.gain.cancelScheduledValues(n);musicGain.gain.setValueAtTime(0.25,n);musicGain.gain.linearRampToValueAtTime(0.7,n+t);}
function sfx(type){
  if(!AC)return;const t=AC.currentTime;
  if(type==='shot'){tone('square',1200,600,0.04,0.09,t);}
  else if(type==='laser'){tone('sawtooth',2200,900,0.05,0.07,t);}
  else if(type==='hit'){tone('square',300,120,0.05,0.12,t);}
  else if(type==='tink'){tone('triangle',2600,2400,0.04,0.06,t);}
  else if(type==='boom'){noise(0.25,0.45,t,3000);}
  else if(type==='big'){noise(1.2,0.9,t,4000);tone('sawtooth',160,30,1.1,0.4,t);tone('sine',90,25,1.4,0.6,t);}
  else if(type==='item'){[660,880,1320].forEach((f,i)=>tone('square',f,f,0.06,0.2,t+i*0.06));}
  else if(type==='form'){[523,784,1046].forEach((f,i)=>tone('triangle',f,f,0.08,0.18,t+i*0.05));}
  else if(type==='bomb'){duck(1.6);tone('sawtooth',180,1400,0.16,0.22,t);tone('sine',140,28,1.3,0.9,t+0.14);noise(1.4,1.0,t+0.14,6000,true);tone('triangle',900,120,0.9,0.35,t+0.14,true);[1568,2093,2637,3136,2637,3520].forEach((f,i)=>tone('sine',f,f*0.98,0.25,0.07,t+0.35+i*0.07,true));}
  else if(type==='damage'){tone('square',500,90,0.3,0.35,t);noise(0.25,0.5,t,2500);}
  else if(type==='miss'){tone('sawtooth',600,80,0.5,0.4,t);noise(0.4,0.6,t,3000);}
  else if(type==='warn'){tone('square',440,440,0.25,0.22,t);tone('square',440,440,0.25,0.22,t+0.4);}
  else if(type==='talk'){tone('square',900,900,0.02,0.05,t);}
  else if(type==='select'){tone('square',1200,1200,0.04,0.1,t);}
  else if(type==='decide'){tone('square',880,1760,0.12,0.15,t);}
  else if(type==='whoosh'){noise(1.2,0.5,t,1500);tone('sawtooth',120,600,1.0,0.12,t);}
  else if(type==='flash'){tone('sine',2400,600,0.6,0.2,t,true);noise(0.6,0.3,t,8000);}
  else if(type==='charge'){tone('sawtooth',90,900,1.6,0.18,t);tone('sine',200,2400,1.6,0.08,t);}
  else if(type==='beam'){duck(1.8);noise(1.8,0.8,t,7000,true);tone('sawtooth',70,55,1.7,0.45,t);tone('square',140,110,1.7,0.18,t);}

function terrainAmp(){
  if(state!=='stage'&&state!=='warning')return 0;const t=stageT;
  if(loop2){const L=ST[stageNo].len;if(t<4||t>L+2)return 0;return Math.min(1.15,(t-4)/3,(L+2-t)/2);}
  if(stageNo!==2)return 0;if(t<38||t>91)return 0;return Math.min(1,(t-38)/4,(91-t)/3);}
function narrow(){const t=stageT;if(loop2)return Math.max(0,Math.sin(t*0.22))*0.9;return (t>58&&t<76)?Math.min(1,(t-58)/2,(76-t)/2):0;}
function ceilY(x){const a=terrainAmp();if(!a)return -99;const w=x+stageT*70;return a*(14+10*Math.sin(w*0.013)+8*Math.sin(w*0.031+1)+narrow()*22);}
function floorY(x){const a=terrainAmp();if(!a)return PH+99;const w=x+stageT*70;return PH-a*(18+10*Math.sin(w*0.011+2)+8*Math.sin(w*0.027)+narrow()*22);}
function corridorY(y,x){if(!terrainAmp())return y;const c=ceilY(x)+18,f=floorY(x)-18;return Math.max(c,Math.min(f,y));}

    const a=power===1?[[0,-3],[0,3]]:power===2?[[0,0],[-0.12,-2],[0.12,2]]:[[0,0],[-0.1,-2],[0.1,2],[-0.24,-3],[0.24,3]];
    for(const [ang,dy] of a)shots.push({x:P.x+16,y:P.y+dy+1,vx:Math.cos(ang)*330,vy:Math.sin(ang)*330,dmg:1});
    sfx('shot');
  }else{P.cool=0.11;
    const ys=power===1?[0]:power===2?[-3,3]:[-5,0,5];
    for(const dy of ys)shots.push({x:P.x+16,y:P.y+dy+1,vx:540,vy:0,dmg:0.75,laser:true,hit:new Set()});
    for(const o of orbs)shots.push({x:o.x+6,y:o.y,vx:360,vy:0,dmg:0.5,orb:true});
    sfx('laser');
  }
}
function useBomb(){if(bombs<=0||!P.alive||bombFX)return;bombs--;if(tut)tut.bombed=true;sfx('bomb');P.inv=Math.max(P.inv,2.0);bombFX={x:P.x,y:P.y,t:0,id:Math.random()};flash=1;shake=1.2;}
function updateBomb(dt){if(!bombFX)return;const B=bombFX;B.t+=dt;const R=20+B.t*560;
  if(B.t<1.0){
    eshots=eshots.filter(s=>{if(Math.hypot(s.x-B.x,s.y-B.y)<R){score+=10;parts.push({x:s.x,y:s.y,vx:(Math.random()-0.5)*40,vy:-20-Math.random()*30,t:0,life:0.6,col:'#fff6b0',sz:2});return false;}return true;});
    for(const e of enemies){if(e.type!=='rock'&&e.bombed!==B.id&&Math.hypot(e.x-B.x,e.y-B.y)<R){e.bombed=B.id;hurtEnemy(e,30);}}
    if(boss&&!boss.dead&&!boss.core&&!boss.waiting&&boss.bombed!==B.id&&Math.hypot(boss.x-B.x,boss.y-B.y)<R){boss.bombed=B.id;hurtBoss(60,true);}}
  if(B.t>1.4)bombFX=null;}
function playerHit(){if(P.inv>0||!P.alive)return;hits++;life--;eshots=eshots.filter(s=>Math.hypot(s.x-P.x,s.y-P.y)>40);
  if(life>0){P.inv=1.6;shake=0.6;flash=0.3;sfx('damage');burst(P.x,P.y,'#ff8a6a',12);return;}
  P.alive=false;P.respawn=1.6;lives--;life=MAX_LIFE;bombs=3;power=Math.max(1,power-1);burst(P.x,P.y,'#ffcf6a',30);sfx('miss');shake=0.8;eshots=[];}

function updateEnemies(dt){const s=ST[stageNo],sp=s.spd,bs=s.bspd;
  for(const e of enemies){e.t+=dt;e.flash=Math.max(0,e.flash-dt);
    if(e.type==='rock'){e.x-=55*dt;e.rot+=e.vr*dt;}
    else if(e.type==='target'){e.y=e.y0+Math.sin(e.t*2)*6;continue;}
    else if(e.type==='jelly'){e.x-=62*sp*dt;e.y=e.y0+Math.sin(e.t*2.6)*20;}
    else if(e.type==='puffer'){e.x-=34*sp*dt;e.y=e.y0+Math.sin(e.t*1.4)*10;if(stageNo===3){e.st=(e.st===undefined?1.5:e.st)-dt;if(e.st<=0&&P.alive){e.st=2.5;ringShot(e.x,e.y,6,55*bs,e.t);}}}
    else if(e.type==='mini'){e.x+=e.vx*sp*dt;e.y+=e.vy*dt;}
    else if(e.type==='chick'){e.x-=105*sp*dt;e.y=e.y0+Math.sin(e.t*3+e.ph)*34;}
    else if(e.type==='jellyfish'){const tx=W-80;if(e.t<5){e.x+=(tx-e.x)*Math.min(1,dt*1.8);}else e.x-=110*dt;e.y=e.y0+Math.sin(e.t*1.8)*8;
      e.st=(e.st===undefined?0.8:e.st)-dt;if(e.st<=0&&e.t<5.5&&P.alive){e.st=stageNo===1?1.6:1.2;if(stageNo===1)aimShot(e.x-8,e.y,80*bs,0);else for(const o of [-0.15,0.15])aimShot(e.x-8,e.y,80*bs,o);}}
    else if(e.type==='slug'){e.x-=(e.crawl?40:22)*dt;if(e.crawl&&terrainAmp())e.y=floorY(e.x)-11;else e.y=e.y0+Math.sin(e.t*0.9)*14;
      e.st=(e.st===undefined?1.2:e.st)-dt;if(e.st<=0&&P.alive&&e.x<W-10){e.st=2.4/bs;for(const o of [-0.3,0,0.3])aimShot(e.x-10,e.y,70*bs,o);}}
    else if(e.type==='flower'){if(e.t<e.wait){e.x-=50*dt;}else{if(!e.dash){e.dash=true;const a=Math.atan2(P.y-e.y,P.x-e.x);e.vx=Math.cos(a)*170*sp;e.vy=Math.sin(a)*170*sp;}e.x+=e.vx*dt;e.y+=e.vy*dt;}}
    else if(e.type==='shadow'){const tx=(boss?boss.x:W)-110-(e.idx||0)*34;e.x+=(tx-e.x)*Math.min(1,dt*2);const ty=PH-P.y+(e.idx?24:0);e.y+=(Math.max(14,Math.min(PH-14,ty))-e.y)*Math.min(1,dt*3);
      e.st=(e.st===undefined?1:e.st)-dt;if(e.st<=0&&P.alive){e.st=1.3;aimShot(e.x-12,e.y,110,0);}}
    if(P.alive&&P.inv<=0&&Math.hypot(e.x-P.x,e.y-P.y)<e.r+3)playerHit();
  }
  enemies=enemies.filter(e=>e.hp>0&&e.x>-40&&e.x<W+60&&e.y>-40&&e.y<PH+40);
}
function aimShot(x,y,spd,off){const a=Math.atan2(P.y-y,P.x-x)+off;eshots.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd});
  if(loop2&&state!=='tutorial'){for(const d of [-0.2,0.2])eshots.push({x,y,vx:Math.cos(a+d)*spd*0.9,vy:Math.sin(a+d)*spd*0.9});}}
function ringShot(x,y,n,spd,off){if(loop2&&state!=='tutorial')n=Math.round(n*1.5);for(let i=0;i<n;i++){const a=off+i*Math.PI*2/n;eshots.push({x,y,vx:Math.cos(a)*spd,vy:Math.sin(a)*spd});}}
function hurtEnemy(e,d){if(e.hp<=0||e.type==='rock')return;e.hp-=d;e.flash=0.08;lastEnemyName=ENEMY_DEF[e.type].name;
  if(e.hp<=0){kills++;score+=ENEMY_DEF[e.type].score;burst(e.x,e.y,'#fff2a8',12);sfx('boom');
    if(e.type==='puffer'){for(const s of [-1,1])spawn('mini',e.x,e.y,{vx:-50,vy:s*45});}
    if(e.lead||kills%25===0)items.push({x:e.x,y:e.y,t:0,kind:kills%50===0?'B':'P'});}
  else sfx('hit');}
function updateShots(dt){
  for(const s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;
    for(const e of enemies){if(e.hp>0&&Math.hypot(e.x-s.x,e.y-s.y)<e.r+3){if(e.type==='rock'){s.dead=true;if(Math.random()<0.3)sfx('tink');break;}if(s.laser){if(s.hit.has(e))continue;s.hit.add(e);hurtEnemy(e,s.dmg);}else{hurtEnemy(e,s.dmg);s.dead=true;break;}}}
    if(!s.dead&&boss&&!boss.dead&&!boss.core&&bossHitTest(s.x,s.y)){if(boss.kind===2&&!boss.open){s.dead=true;if(Math.random()<0.3){sfx('tink');parts.push({x:s.x,y:s.y,vx:-60,vy:(Math.random()-0.5)*80,t:0,life:0.25,col:'#ffffff',sz:2});}}else{hurtBoss(s.dmg);s.dead=true;}}
    if(!s.dead&&terrainAmp()>0&&(s.y<ceilY(s.x)||s.y>floorY(s.x)))s.dead=true;}
  shots=shots.filter(s=>!s.dead&&s.x<W+10&&s.y>-10&&s.y<PH+10);
  for(const s of eshots){s.x+=s.vx*dt;s.y+=s.vy*dt;if(P.alive&&P.inv<=0&&Math.hypot(s.x-P.x,s.y-P.y)<3.2){playerHit();s.dead=true;}}
  eshots=eshots.filter(s=>!s.dead&&s.x>-10&&s.x<W+10&&s.y>-10&&s.y<PH+10);
}
function updateItems(dt){for(const it of items){it.t+=dt;it.x-=30*dt;it.y+=Math.sin(it.t*3)*12*dt;
  if(P.alive&&Math.hypot(it.x-P.x,it.y-P.y)<16){it.dead=true;sfx('item');if(it.kind==='P'){if(power<3)power++;else score+=1000;}else bombs=Math.min(5,bombs+1);}}
  items=items.filter(i=>!i.dead&&i.x>-10);}
function burst(x,y,col,n){for(let i=0;i<n;i++){const a=Math.random()*Math.PI*2,s=30+Math.random()*120;parts.push({x,y,vx:Math.cos(a)*s,vy:Math.sin(a)*s,t:0,life:0.3+Math.random()*0.5,col,sz:2});}}

// ===== ボス =====
function bossHitTest(x,y){const B=boss;let cx=B.x+4,cy=B.y,rx=58,ry=36;if(B.kind===2){cx=B.x;cy=B.y+4;rx=62;ry=46;}else if(B.kind===3){cx=B.x;cy=B.y-14;rx=66;ry=38;}else if(B.kind===4){cx=B.x;cy=B.y;rx=46;ry=22;}const dx=(x-cx)/rx,dy=(y-cy)/ry;return dx*dx+dy*dy<1;}
function bossMouth(){const B=boss;if(B.kind===1)return{x:B.x-56,y:B.y+6};if(B.kind===2)return{x:B.x-48,y:B.y};if(B.kind===4)return{x:B.x-48,y:B.y};return{x:B.x-50,y:B.y-12};}
function updateBoss(dt){const B=boss;B.t+=dt;B.flash=Math.max(0,B.flash-dt);
  if(B.dead){B.deadT+=dt;if(Math.random()<0.6)burst(B.x+(Math.random()-0.5)*110,B.y+(Math.random()-0.5)*70,Math.random()<0.5?'#ff9ec8':'#fff2a8',6);
    if(Math.random()<0.15)sfx('boom');
    if(B.deadT>2.8){const n=B.kind;boss=null;
      if(loop2&&n===3){radioQ=[];radio=null;startTalk('m_self',()=>beginBoss4());}
      else if(n===4){fadeMusic(1.5);if(!ld('fantaryon_loop2clear'))sv('fantaryon_loop2clear','1');startTalk('m_end',()=>startEnding('loop2'));}
      else{fadeMusic(1.2);stageCleared(n);}}
    return;}
  if(B.core){updateCore(dt);return;}
  if(B.kind===4){updateBoss4(dt);return;}
  const tx=W-100;if(B.x>tx)B.x-=50*dt;
  const ratio=B.hp/B.max;B.phase=ratio>0.66?0:ratio>0.33?1:2;
  B.ang+=dt*(B.phase===2?1.2:0.6);
  if(B.kind!==2&&Math.random()<dt*3)parts.push({x:B.x+(Math.random()-0.3)*100,y:B.y+40,vx:-10,vy:-25-Math.random()*20,t:0,life:2,col:'#d8f0ff',sz:3,bub:true});
  if(B.x>W-40)return;
  const m=bossMouth(),bs=ST[stageNo].bspd;
  if(B.kind===1){
    if(B.phase===0){B.y=PH/2+Math.sin(B.t*0.8)*40;B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=2.4;for(const s of [-1,1])spawn('jelly',m.x,m.y+s*16);}
      B.shotT-=dt;if(B.shotT<=0&&P.alive){B.shotT=1.4;for(const o of [-0.25,0,0.25])aimShot(m.x,m.y,95,o);}}
    else if(B.phase===1){B.y=PH/2+Math.sin(B.t*1.1)*58;B.shotT-=dt;if(B.shotT<=0){B.shotT=1.3;ringShot(B.x,B.y,16,70,B.ang);}
      B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=3;spawn('flower',m.x,m.y,{wait:0.3});}}
    else{B.y=PH/2+Math.sin(B.t*0.6)*30;B.shotT-=dt;if(B.shotT<=0){B.shotT=0.12;const a=B.ang*3;for(const o of [0,Math.PI])eshots.push({x:B.x,y:B.y,vx:Math.cos(a+o)*65,vy:Math.sin(a+o)*65});}
      B.spawnT-=dt;if(B.spawnT<=0&&P.alive){B.spawnT=1.8;aimShot(m.x,m.y,110,0);}}
  }else if(B.kind===2){
    B.y=PH/2+Math.sin(B.t*0.7)*(B.phase===2?50:30);
    B.cyc-=dt;
    if(B.cyc<=0){B.open=!B.open;B.cyc=B.open?(B.phase===2?4.2:3.2):(B.phase===2?1.4:2.2);
      if(B.open){ringShot(m.x,m.y,B.phase===0?14:20,70*bs,B.ang);const want=B.phase===0?1:2;const have=enemies.filter(e=>e.type==='shadow').length;for(let i=have;i<want;i++)spawn('shadow',B.x-30,B.y,{idx:i});}}
    if(B.open){B.shotT-=dt;if(B.shotT<=0&&P.alive){B.shotT=B.phase===2?0.6:0.9;for(const o of [-0.2,0,0.2])aimShot(m.x,m.y,100*bs,o);}}
    else{B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=1.1;ringShot(B.x,B.y,8,55,B.ang*2);}}
  }else{
    if(bossBeam(B,dt)){if(P.alive&&P.inv<=0&&bossHitTest(P.x,P.y))playerHit();return;}
    B.y=PH/2+Math.sin(B.t*0.5)*36;
    if(B.phase===0){B.shotT-=dt;if(B.shotT<=0&&P.alive){B.shotT=1.4;for(const o of [-0.3,-0.15,0,0.15,0.3])aimShot(m.x,m.y,95*bs,o);}
      B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=0.18;const tx2=B.x-50+Math.random()*100;eshots.push({x:tx2,y:B.y+40,vx:-70-Math.random()*30,vy:(Math.random()<0.5?-1:1)*(20+Math.random()*40)});}}
    else if(B.phase===1){B.shotT-=dt;if(B.shotT<=0){B.shotT=0.1;const a=B.ang*2.6;for(const o of [0,Math.PI*2/3,Math.PI*4/3])eshots.push({x:B.x,y:B.y-14,vx:Math.cos(a+o)*70,vy:Math.sin(a+o)*70});}
      B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=3;for(const s of [-1,1])spawn('mini',B.x-40,B.y+s*30,{vx:-60,vy:s*30});}}
    else{B.shotT-=dt;if(B.shotT<=0){B.shotT=1.1;ringShot(B.x,B.y-14,22,72*bs,B.ang);}
      B.spawnT-=dt;if(B.spawnT<=0&&P.alive){B.spawnT=0.7;aimShot(m.x,m.y,130,0);}}
  }
  if(P.alive&&P.inv<=0&&bossHitTest(P.x,P.y))playerHit();
}
// 溜め撃ちビーム：1.6秒溜め（予告線）→1.7秒照射。照射中は口から左端まで極太の光線
function bossBeam(B,dt){
  if(B.beam===undefined){B.beam=null;B.beamCd=5;}
  if(!B.beam){B.beamCd-=dt;if(B.beamCd<=0&&P.alive){B.beam={t:0,y:Math.max(30,Math.min(PH-30,P.y))};sfx('charge');}else return false;}
  const bm=B.beam;bm.t+=dt;const m=bossMouth();
  B.y+=(bm.y-(m.y-B.y)-B.y)*Math.min(1,dt*4);bm.x=m.x;bm.yy=m.y;
  if(bm.t<1.6){if(Math.random()<0.8)parts.push({x:m.x+(Math.random()-0.5)*60,y:m.y+(Math.random()-0.5)*60,vx:0,vy:0,t:0,life:0.25,col:'#bffcff',sz:2,to:true});
    for(const p of parts)if(p.to){p.vx=(m.x-p.x)*6;p.vy=(m.y-p.y)*6;}}
  else if(bm.t<3.3){if(!bm.fired){bm.fired=true;sfx('beam');shake=Math.max(shake,1.2);}shake=Math.max(shake,0.5);
    if(P.alive&&P.inv<=0&&P.x<m.x&&Math.abs(P.y-m.y)<13)playerHit();}
  else{B.beam=null;B.beamCd=B.phase===2?6:8.5;return false;}
  return true;}
function drawRam(g){
  if(!boss||!boss.ram)return;const t=boss.ram.t;g.save();g.globalCompositeOperation='lighter';
  const pr=10+Math.sin(t*30)*3+t*6;const rg=g.createRadialGradient(P.x,P.y,0,P.x,P.y,pr*2);rg.addColorStop(0,'rgba(255,255,255,0.9)');rg.addColorStop(0.4,'rgba(255,90,60,'+(0.5+0.4*Math.sin(t*24))+')');rg.addColorStop(1,'rgba(255,60,40,0)');g.fillStyle=rg;g.beginPath();g.arc(P.x,P.y,pr*2,0,Math.PI*2);g.fill();
  if(t>1.8){const R=(t-1.8)*420;const wg=g.createRadialGradient(P.x,P.y,0,P.x,P.y,Math.max(1,R));wg.addColorStop(0,'rgba(255,255,255,1)');wg.addColorStop(0.7,'rgba(255,240,210,0.9)');wg.addColorStop(1,'rgba(255,200,150,0)');g.fillStyle=wg;g.beginPath();g.arc(P.x,P.y,Math.max(1,R),0,Math.PI*2);g.fill();}
  g.restore();
  if(t>2.9){g.fillStyle='rgba(255,255,255,'+Math.min(1,(t-2.9)/0.6)+')';g.fillRect(0,0,W,H);}}
function drawBeam(g){
  if(!boss||!boss.beam||boss.dead||boss.core)return;const bm=boss.beam;if(bm.x===undefined)return;
  g.save();g.globalCompositeOperation='lighter';
  if(bm.t<1.6){const a=0.3+0.3*Math.sin(bm.t*30);g.fillStyle='rgba(255,80,120,'+a+')';g.fillRect(0,bm.yy-0.5,bm.x,1);
    const r=4+bm.t*8;const gr=g.createRadialGradient(bm.x,bm.yy,0,bm.x,bm.yy,r*2);gr.addColorStop(0,'rgba(255,255,255,0.95)');gr.addColorStop(0.4,'rgba(140,240,255,0.7)');gr.addColorStop(1,'rgba(80,180,255,0)');g.fillStyle=gr;g.beginPath();g.arc(bm.x,bm.yy,r*2,0,Math.PI*2);g.fill();
    if(Math.floor(bm.t*8)%2===0){g.globalCompositeOperation='source-over';g.fillStyle='#ff5a7a';g.font='10px '+FONT;g.textAlign='center';g.fillText('！',bm.x-30,bm.yy-16);}}
  else{const tt=bm.t-1.6,grow=Math.min(1,tt/0.15),fade=bm.t>3.0?Math.max(0,(3.3-bm.t)/0.3):1,hh=16*grow*fade+Math.sin(bm.t*60)*1.5;
    const gr=g.createLinearGradient(0,bm.yy-hh*1.8,0,bm.yy+hh*1.8);gr.addColorStop(0,'rgba(80,160,255,0)');gr.addColorStop(0.3,'rgba(120,220,255,0.7)');gr.addColorStop(0.5,'rgba(255,255,255,1)');gr.addColorStop(0.7,'rgba(120,220,255,0.7)');gr.addColorStop(1,'rgba(80,160,255,0)');
    g.fillStyle=gr;g.fillRect(0,bm.yy-hh*1.8,bm.x,hh*3.6);
    const cg=g.createRadialGradient(bm.x,bm.yy,0,bm.x,bm.yy,hh*2.5);cg.addColorStop(0,'rgba(255,255,255,1)');cg.addColorStop(1,'rgba(120,220,255,0)');g.fillStyle=cg;g.beginPath();g.arc(bm.x,bm.yy,hh*2.5,0,Math.PI*2);g.fill();
    for(let i=0;i<6;i++){g.fillStyle='rgba(255,255,255,0.6)';g.fillRect(Math.random()*bm.x,bm.yy+(Math.random()-0.5)*hh*2,10+Math.random()*30,1);}}
  g.restore();}
function updateBoss4(dt){const B=boss;const ratio=B.hp/B.max;B.phase=ratio>0.66?0:ratio>0.33?1:2;B.ang+=dt*0.9;
  if(B.x>W-90&&!B.dash)B.x-=60*dt;
  B.y+=(Math.max(24,Math.min(PH-24,P.y))-B.y)*Math.min(1,dt*(B.phase===2?2.2:1.4));
  const m=bossMouth();
  B.shotT-=dt;if(B.shotT<=0&&P.alive){B.shotT=B.phase===0?0.8:0.6;for(const o of [-0.24,-0.12,0,0.12,0.24])aimShot(m.x,m.y,120,o);}
  if(B.phase>=1){B.spawnT-=dt;if(B.spawnT<=0){B.spawnT=4;B.dash=1.4;B.dx=P.x;}
    if(B.dash>0){B.dash-=dt;if(B.dash>0.7)B.x+=(Math.max(60,B.dx)-B.x)*Math.min(1,dt*3);else B.x+=((W-90)-B.x)*Math.min(1,dt*3);if(B.dash<=0){B.dash=0;ringShot(B.x,B.y,16,70,B.ang);}}}
  if(B.phase===2){if(bossBeam(B,dt)){if(P.alive&&P.inv<=0&&bossHitTest(P.x,P.y))playerHit();return;}B.rT=(B.rT||2)-dt;if(B.rT<=0){B.rT=2.2;ringShot(B.x,B.y,24,60,B.ang*2);}}
  if(P.alive&&P.inv<=0&&bossHitTest(P.x,P.y))playerHit();}
function hurtBoss(d,bomb){const B=boss;if(B.x>W-30||B.dead||B.core)return;if(B.kind===2&&!B.open&&!bomb)return;B.hp-=d;B.flash=0.06;lastEnemyName=bossName(B.kind);
  if(B.hp<=0){B.hp=0;eshots=[];enemies=[];

function updateCore(dt){const B=boss;B.coreT+=dt;eshots=[];
  if(B.x>W-110)B.x-=20*dt;B.y+=(PH/2-B.y)*Math.min(1,dt);
  if(Math.random()<dt*6)burst(B.x+(Math.random()-0.5)*100,B.y+(Math.random()-0.5)*60,'#8ff0ff',3);
  const cx=B.x,cy=B.y-14;
  if(B.trueRoute){
    if(B.killT!==undefined){B.killT+=dt;if(Math.random()<0.7)burst(cx+(Math.random()-0.5)*120,cy+(Math.random()-0.5)*80,Math.random()<0.5?'#bffcff':'#fff2a8',8);if(Math.random()<0.2)sfx('boom');
      if(B.killT>2.8){B.dead=true;shots=[];fadeMusic(1.5);startTalk('trueEnd',()=>startEnding('true'));}return;}
    if(B.coreT>2.4&&bombFX&&bombFX.t<0.5){B.killT=0;sfx('big');flash=1;shake=2;}
    return;}
  if(B.ram){const r=B.ram;r.t+=dt;P.x+=((cx-26)-P.x)*Math.min(1,dt*3);P.y+=(cy-P.y)*Math.min(1,dt*3);shake=Math.max(shake,0.3+r.t*0.3);
    if(r.t>1.8&&!r.boom){r.boom=true;sfx('big');sfx('beam');shake=2;}
    if(r.t>2&&Math.random()<0.8)burst(P.x+(Math.random()-0.5)*40,P.y+(Math.random()-0.5)*40,Math.random()<0.5?'#ffffff':'#ffb26a',6);
    if(r.t>3.6){B.dead=true;eshots=[];shots=[];startEnding('normal');}
    return;}
  if(B.coreT>2&&P.alive&&(Math.hypot(P.x-cx,P.y-cy)<34||bossHitTest(P.x,P.y))){
    B.ram={t:0};eshots=[];shots=[];sfx('charge');fadeMusic(2.5);radioQ=[];radio=null;showRadio('pop','……オヤジさん。\n壊して帰れなくて、ごめん。',3.6);
  }
}

function drawPlanet(g,scroll,top,texKey,atmo,R){
  const tex=IMG[texKey];if(!tex.complete)return;R=R||960;
  const cy=top+R,cx=W/2,tw=tex.width,th=tex.height;
  g.imageSmoothingEnabled=true;
  const capH=H-top+2,step=0.5;
  for(let y=top;y<H+1;y+=step){
    const dyc=cy-y;if(dyc>R)continue;const half=Math.sqrt(R*R-dyc*dyc);const x0=cx-half,ww=half*2;
    const t=Math.max(0.0005,(y-top)/capH);const v=Math.min(th-1,th*0.92*Math.sqrt(t));const sw=tw*(0.55-0.25*t);
    let sx=((scroll*(18+60*t))%tw+tw)%tw;
    if(sx+sw<=tw)g.drawImage(tex,sx,v,sw,1,x0,y,ww,step+0.6);
    else{const a=tw-sx,pa=a/sw*ww;g.drawImage(tex,sx,v,a,1,x0,y,pa,step+0.6);g.drawImage(tex,0,v,sw-a,1,x0+pa,y,ww-pa,step+0.6);}
  }
  g.save();g.beginPath();g.arc(cx,cy,R,0,Math.PI*2);g.clip();
  let gr=g.createLinearGradient(0,top,0,top+40);gr.addColorStop(0,atmo?'rgba(170,215,255,0.85)':'rgba(200,200,210,0.25)');gr.addColorStop(0.25,atmo?'rgba(120,180,240,0.35)':'rgba(0,0,0,0)');gr.addColorStop(1,'rgba(0,0,0,0)');g.fillStyle=gr;g.fillRect(0,top,W,42);

  g.restore();
  if(atmo){const ag=g.createRadialGradient(cx,cy,R-4,cx,cy,R+22);ag.addColorStop(0,'rgba(140,200,255,0)');ag.addColorStop(0.12,'rgba(180,225,255,0.95)');ag.addColorStop(0.35,'rgba(90,160,255,0.45)');ag.addColorStop(1,'rgba(40,90,220,0)');
    g.fillStyle=ag;g.beginPath();g.arc(cx,cy,R+22,0,Math.PI*2);g.arc(cx,cy,R-4,0,Math.PI*2,true);g.fill();}
}

function enemyImg(e){const d=ENEMY_DEF[e.type];if(e.type==='shadow')return IMG.ship_shadow;if(e.type==='target')return IMG.e_jelly;return IMG[d.img+(loop2?'_m':ST[stageNo].tint)]||IMG[d.img];}

  for(let i=0;i<n;i++){const a=i*Math.PI*2/n,r=e.r*(i%2?0.75:1.1);i?b.lineTo(Math.cos(a)*r,Math.sin(a)*r):b.moveTo(Math.cos(a)*r,Math.sin(a)*r);}

    if(endType==='normal')txt('真エンディング条件：一度もコンティニューせずにラスボスを倒す',W/2,202,10,'#9aa6cc','center');
    if(endType==='true')txt('タイトルに「2ND MISSION」が追加されました',W/2,202,10,'#f0c86a','center');
    if(t>35.5&&Math.floor(gT*1.6)%2===0)txt(isTouch?'タップでタイトルへ':'Enterキーでタイトルへ',W/2,236,12,'#e6e9f4','center');
    ctx.globalAlpha=1;}
}

// ===== チュートリアル・システムログの表示 =====
function drawTutorial(){
  const text=TUT_TEXT[Math.min(tut.step,TUT_TEXT.length-1)]();
  txtS('TRAINING　'+(Math.min(tut.step,TUT_TEXT.length-1)+1)+' / '+TUT_TEXT.length,10,22,11,'#8affc0');
  box(W-62,8,54,20,'rgba(8,12,40,0.8)','#8a94c4');txt(isTouch?'SKIP':'S:SKIP',W-35,22,10,'#c8d0ec','center');
  box(8,PH-64,W-16,58,'rgba(6,20,16,0.92)','#8affc0');portrait('sgt',12,PH-60,50);txt('ゴンダ軍曹',68,PH-48,10,CHARS.sgt.col);
  text.split('\n').forEach((l,i)=>txt(l,68,PH-32+i*15,11,'#e8f2ea'));
  if(tut.step>=3&&Math.floor(gT*2)%2)txt(isTouch?'タップで次へ ▼':'Enter／Z で次へ ▼',W-16,PH-10,9,'#f0c86a','right');
  if(tut.step===3){ctx.strokeStyle='#ffe066';ctx.lineWidth=1.5;ctx.strokeRect(2,PH+1,110,HUD-2);txtS('▲ 残機・ライフ',8,PH-70,10,'#ffe066');}
  if(tut.step===0){const p=Math.min(1,tut.moved/180);ctx.fillStyle='#103020';ctx.fillRect(W/2-60,34,120,6);ctx.fillStyle='#8affc0';ctx.fillRect(W/2-60,34,120*p,6);}
}
const SYSLOG=['> SYSTEM LOG ― LP-07 "LOLLIPOP"','> 搭載意識　：被験者 No.630','> 肉体　　　：処分済','> 記憶領域　：一部消去（任務適合のため）','> 状態　　　：稼働中'];
function drawSyslog(){ui();ctx.fillStyle='#000';ctx.fillRect(0,0,W,H);
  ctx.fillStyle='rgba(120,255,160,0.06)';for(let y=0;y<H;y+=3)ctx.fillRect(0,y,W,1);
  const t=stateT;for(let i=0;i<SYSLOG.length;i++){const st=0.5+i*1.0;if(t<st)break;const n=Math.min(SYSLOG[i].length,Math.floor((t-st)*30));let str=SYSLOG[i].slice(0,n);
    if(Math.random()<0.06)str=str.replace(/[^\s>]/g,c=>Math.random()<0.3?'#':c);
    const gx=Math.random()<0.05?(Math.random()-0.5)*6:0;txt(str,60+gx,70+i*24,13,i===2?'#ff8a8a':'#8affb0');}
  if(t>5.6&&Math.floor(gT*3)%2)txt('_',60,70+SYSLOG.length*24,13,'#8affb0');
  if(Math.random()<0.08){ctx.fillStyle='rgba(140,255,180,0.15)';ctx.fillRect(0,Math.random()*H,W,2+Math.random()*6);}
  if(t>1.2)txt(isTouch?'タップで次へ':'Enter：次へ',W-10,H-10,9,'#4a7a5a','right');}

function drawPauseMenu(){ctx.fillStyle='rgba(4,6,20,0.75)';ctx.fillRect(0,0,W,H);txtS('PAUSE',W/2,108,28,'#e6e9f4','center');
  for(let i=0;i<2;i++){const r=pauseBtnRect(i),on=i===pauseIdx;box(r.x,r.y,r.w,r.h,on?'rgba(255,180,110,0.25)':'rgba(8,12,40,0.9)',on?'#ffb26a':'#8a94c4');txt(PAUSE_ITEMS[i],W/2,r.y+15,12,on?'#ffffff':'#c8d0ec','center');}
  txt(isTouch?'ボタンをタップ':'↑↓：選択　Enter：決定　Esc：再開',W/2,206,9,'#9aa6cc','center');}

// ===== 描画本体 =====
function clipGame(){ctx.save();ctx.beginPath();ctx.rect(ox*dpr,oy*dpr,W*sc*dpr,H*sc*dpr);ctx.clip();}
function render(isPortrait){
  ctx.setTransform(1,0,0,1,0,0);ctx.fillStyle='#050814';ctx.fillRect(0,0,cv.width,cv.height);
  if(isPortrait){ctx.setTransform(dpr,0,0,dpr,0,0);txt('端末を横向きにしてください',cw/2,ch/2,18,'#e6e9f4','center','middle');txt('このゲームは横画面専用です',cw/2,ch/2+30,14,'#9aa6cc','center','middle');return;}
  if(state==='boot'){ui();ctx.fillStyle='#0b1236';ctx.fillRect(0,0,W,H);ctx.imageSmoothingEnabled=true;if(IMG.logo.complete)ctx.drawImage(IMG.logo,W/2-150,40,300,150);
    if(Math.floor(gT*1.6)%2===0)txt(isTouch?'画面をタップしてください':'クリック または Enterキーでスタート',W/2,226,13,'#e6e9f4','center');txt('音が出ます',W/2,246,9,'#9aa6cc','center');return;}
  if(state==='opening'){clipGame();drawOpening();ctx.restore();return;}
  if(state==='ending'){clipGame();drawEnding();ctx.restore();return;}
  if(state==='rift'){clipGame();drawRift();ctx.restore();return;}
  if(state==='credits'){clipGame();drawCredits();ctx.restore();
    if(credT>31.5&&(tapQueue.length||pressed.Enter||pressed.KeyZ||pressed.Space)){}
    return;}
  const sh=shake>0?(Math.random()-0.5)*shake*5:0,sv=shake>0?(Math.random()-0.5)*shake*3:0;
  clipGame();
  ctx.setTransform(sc*dpr,0,0,sc*dpr,(ox+sh*sc)*dpr,(oy+sv*sc)*dpr);
  if(state==='syslog'){ctx.restore();drawSyslog();return;}
  drawBackground(ctx,bgScroll);
  drawSprites();ctx.imageSmoothingEnabled=false;ctx.drawImage(buf,0,0);drawBeam(ctx);drawRam(ctx);
  drawBombFX(ctx);
  if(flash>0){ctx.fillStyle='rgba(255,255,255,'+(flash*0.75)+')';ctx.fillRect(0,0,W,H);}
  if(boss&&boss.core){ctx.fillStyle='rgba(0,10,20,0.25)';ctx.fillRect(0,0,W,H);}
  ctx.restore();
  ui();
  if(state==='title'){
    ctx.fillStyle='rgba(2,4,20,0.35)';ctx.fillRect(0,0,W,H);
    txtS('FANTARYON',W/2,86,46,'#ffe6c8','center');txtS('ファンタリオン',W/2,108,12,'#c8d6ff','center');
    const items=titleItems();
    for(let i=0;i<items.length;i++){const y=142+i*17,on=i===titleIdx;if(on){ctx.fillStyle='rgba(255,180,110,0.2)';ctx.fillRect(150,y-13,180,16);ctx.strokeStyle='#ffb26a';ctx.lineWidth=1;ctx.strokeRect(150.5,y-12.5,179,15);}
      txtS((on?'▶ ':'　')+items[i][1],166,y,12,items[i][0]==='loop2'?(on?'#ffe0a0':'#f0c86a'):(on?'#ffffff':'#c8d0ec'));}
    txtS(isTouch?'選んだ項目をもう一度タップで決定':'↑↓：選択　Enter/Z：決定',W/2,142+items.length*17+4,9,'#b4bedc','center');
    if(isIOS&&!standalone)txtS('共有メニューから「ホーム画面に追加」すると全画面で遊べます',W/2,232,8,'#f0c86a','center');
    txtS('Game: ottoky studio　／　Music: Romeo Hijo',W/2,248,9,'#dce2f6','center');txtS('© ottoky studio　ver '+VERSION,W/2,261,8,'#b4bedc','center');
    if(titleMsg){ctx.globalAlpha=Math.min(1,(3-titleMsg.t)*2);box(W/2-120,8,240,22,'rgba(8,12,40,0.92)','#f0c86a');txt(titleMsg.text,W/2,23,11,'#f0c86a','center');ctx.globalAlpha=1;}
    return;}
  if(state==='sound'){
    ctx.fillStyle='rgba(2,4,20,0.7)';ctx.fillRect(0,0,W,H);
    txtS('SOUND TRACK',W/2,30,18,'#ffe6c8','center');txt('Music：Romeo Hijo　「Delusion sound track 01」',W/2,46,9,'#c8d0ec','center');
    for(let i=0;i<=TRACKS.length;i++){const y=66+i*18,on=i===sndIdx;
      if(on){ctx.fillStyle='rgba(255,180,110,0.18)';ctx.fillRect(70,y-13,340,17);ctx.strokeStyle='#ffb26a';ctx.lineWidth=1;ctx.strokeRect(70.5,y-12.5,339,16);}
      if(i===TRACKS.length){txt((on?'▶ ':'　')+'タイトルへ戻る',84,y,12,on?'#ffffff':'#b4bedc');continue;}
      const [k,name,use]=TRACKS[i];const pl=sndPlaying===k;
      txt((pl?'♪ ':(on?'▶ ':'　'))+String(i+1).padStart(2,'0')+'　'+name,84,y,12,pl?'#ffe0a0':(on?'#ffffff':'#c8d0ec'));txt(use,396,y,9,'#9aa6cc','right');}
    if(sndPlaying){for(let i=0;i<24;i++){const h=4+Math.abs(Math.sin(gT*6+i*0.9))*14*Math.abs(Math.sin(gT*2.3+i));ctx.fillStyle='rgba(255,190,110,0.6)';ctx.fillRect(W/2-96+i*8,H-24-h,5,h);}}
    txt(isTouch?'曲をタップで再生・もう一度で停止':'↑↓：選択　Enter：再生／停止　Esc：戻る',W/2,H-6,9,'#9aa6cc','center');
    return;}
  if(state==='select'){
    ctx.fillStyle='rgba(2,4,20,0.6)';ctx.fillRect(0,0,W,H);
    txtS('STAGE SELECT',W/2,34,18,'#ffe6c8','center');txt('デバッグ用：全ステージ選択可能',W/2,50,9,'#f0c86a','center');
    for(let i=0;i<SEL.length;i++){const y=74+i*20,on=i===selIdx;if(on){ctx.fillStyle='rgba(255,180,110,0.18)';ctx.fillRect(90,y-14,300,19);ctx.strokeStyle='#ffb26a';ctx.lineWidth=1;ctx.strokeRect(90.5,y-13.5,299,18);}
      txt((on?'▶ ':'　')+SEL[i],104,y,12,on?'#ffffff':'#b4bedc');}
    txt(isTouch?'選んだ項目をもう一度タップで決定':'↑↓：選択　Enter/Z：決定　Esc：戻る',W/2,H-10,9,'#9aa6cc','center');
    return;}
  if(state==='talk'){drawTalk();return;}
  drawHUD();
  if(state==='tutorial'){drawTutorial();drawControls();if(paused)drawPauseMenu();return;}
  drawRadio();
  if(banner){const a=Math.min(1,banner.t*3,(3.2-banner.t)*2);ctx.globalAlpha=Math.max(0,a);txtS(banner.a,W/2,110,30,'#ffe6c8','center');txtS(banner.b,W/2,134,13,'#dce6ff','center');ctx.globalAlpha=1;}
  if(state==='warning'){const on=Math.floor(stateT*4)%2===0;ctx.fillStyle='rgba(200,20,40,'+(on?0.3:0.14)+')';ctx.fillRect(0,96,W,56);if(on){txtS('WARNING',W/2,126,32,'#ffd0d8','center');}txtS(stageNo===3?'中心核の反応が増大中':stageNo===2?'空間の歪みが接近中':'大型の来訪体が接近中',W/2,144,11,'#ffe0e6','center');}
  if(state==='stageclear'){ctx.fillStyle='rgba(4,6,20,0.6)';ctx.fillRect(0,0,W,H);txtS('STAGE '+clearInfo.n+' CLEAR',W/2,100,28,'#ffe6c8','center');txt('クリアボーナス  +'+clearInfo.bonus,W/2,130,12,'#e6e9f4','center');txt('SCORE '+String(score).padStart(7,'0'),W/2,152,13,'#e6e9f4','center');}
  if(state==='gameover'){ctx.fillStyle='rgba(4,6,20,0.7)';ctx.fillRect(0,0,W,H);txt('GAME OVER',W/2,110,30,'#ffd0d8','center');
    if(stateT>1){txt(isTouch?'タップでコンティニュー':'Enterキーでコンティニュー',W/2,142,12,'#e6e9f4','center');txt('※コンティニューすると真エンディングには進めません',W/2,162,10,'#f0c86a','center');if(!isTouch)txt('Esc / T：タイトルへ',W/2,182,10,'#9aa6cc','center');}}
  if(paused)drawPauseMenu();
  drawControls();
}
// スタッフロール後の操作（結果画面からタイトルへ）
const _uc=updateCredits;
updateCredits=function(dt){const tapped=tapQueue.length>0||pressed.Enter||pressed.KeyZ||pressed.Space;_uc(dt);if(credT>35.5&&tapped){stopMusic();resetRun();loop2=false;resetField();setState('title');}};
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing())togglePause();});
resetRun();resetField();stageT=0;SCRIPT=[];
try{window.focus();cv.focus({preventScroll:true});}catch(_){}
(document.fonts&&document.fonts.load?document.fonts.load('16px DotGothic16'):Promise.resolve()).catch(()=>{}).finally(()=>requestAnimationFrame(t=>{last=t;loop(t);}));
}
